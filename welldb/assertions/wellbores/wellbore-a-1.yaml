# Flow: welldb-welllog-assertion-wellbore-a-1
#
# Proof values of wellbore Wellbore A-1: what OSDU has to hold for its logs, from the estate's own source files
# (welllog_20260924.csv, row 2, and the rows of curves_20260924.csv each test names).
#
# Each test is one of its logs, by project and log name; each row of a test is one curve of that log, and says which
# row of the curve file it is. A row finds its record by full paths (locateBy): the log is the WellLog whose
# data.WellboreID names the wellbore of that name ('[data.WellboreID, data.FacilityName]', read through the reference as
# a dimension label is), of that project (tags.SourceProject) and log name (data.Name), and the curve is the item of
# data.Curves with that mnemonic. Its proof values (check) are full paths into the record WellLog@1.4.0 renders, each
# with the value that record holds; every proof value of a curve is read from that one curve. Units, log types,
# sampling domains, business values and curve families are the references WellLog@1.4.0 writes for the source's words
# (the unit US/F is {partition}:reference-data--UnitOfMeasure:us%2Fft:). A depth is compared within half a millimetre.
#
# Each log also has a test of its samples: its bulk data, read back from the Wellbore DDMS, is held to its parquet curve
# file by its rows, its columns, an index that only increases, and each curve's count and sum, so a sample changed
# anywhere fails the test, however little it moved.
#
# A row whose log or curve OSDU does not hold fails the test, saying by which path it was not found. A test, an assertion,
# a row or a proof value takes disabled: <why> to stay in the flow, reported as skipped, without failing the run. A test
# that says when its proof values were stated (asOf) and how long they hold (validFor: 180d) is flagged past that, a
# warning that it needs new proof values, rather than judged.
#
# Written by gen_assertions.py from the source files. It joins the schedule welldb-welllog-assertions (../../schedules.yaml),
# which runs every flow of assertions once a day. The flow, or one of its assertions, also runs on its own from the
# Assertions page, or
#   sqlflow run welldb-welllog-assertion-wellbore-a-1.yaml
flowType: assertion
name: welldb-welllog-assertion-wellbore-a-1
description: "Proof values of wellbore Wellbore A-1 from the source files, held to what OSDU holds of its logs."
batch: welldb

# The partition the delivery flows deliver to.
partitions: [dev]

schedule: welldb-welllog-assertions

source:
  # The platform and credentials the delivery flows deliver with.
  endpoint: ${env:OSDU_URL}
  auth:
    type: oauth2ClientCredentials
    secondarySecretRef: ${env:OSDU_CLIENT_ID}
    secretRef: ${env:OSDU_CLIENT_SECRET}
    token:
      url: ${env:OSDU_TOKEN_URL}
      body:
        scope: ${env:OSDU_SCOPE}

reliability:
  retry: { attempts: 4, backoff: exponential, baseDelayMs: 500, maxDelayMs: 30000 }
  timeoutSeconds: 100

parallelism:
  recordsAtOnce: 4

defaults:
  examples: 100
  read: storage

# A failed or errored test fails the run, so a schedule's notifications would say so.
failRunOn: error

tests:
  - name: composite
    description: "The COMPOSITE log of Wellbore A-1 in project PROJECT_A: log LOG-0001/1, rows 2 to 11 of the curve file."
    tags: [welldb, composite]
    kind: osdu:wks:work-product-component--WellLog:1.4.0
    assert:
      - name: the COMPOSITE log of Wellbore A-1
        knownValues:
          locateBy:
            '[data.WellboreID, data.FacilityName]': "Wellbore A-1"
            tags.SourceProject: PROJECT_A
            data.Name: COMPOSITE
          check:
            data.VerticalMeasurement.VerticalMeasurement: 42.8
            data.VerticalMeasurement.VerticalMeasurementUnitOfMeasureID: "{partition}:reference-data--UnitOfMeasure:m:"
            data.VerticalMeasurement.VerticalMeasurementTypeID: "{partition}:reference-data--VerticalMeasurementType:KellyBushing:"
            data.SamplingStart: { equals: 2127.504, tolerance: 0.0005 }
            data.SamplingStop: { equals: 2183.5872, tolerance: 0.0005 }
            data.SamplingInterval: 0.1524
            data.ReferenceCurveID: MD
            data.WellLogTypeID: "{partition}:reference-data--LogType:Interpreted:"
            data.SamplingDomainTypeID: "{partition}:reference-data--WellLogSamplingDomainType:Depth:"
            data.LogRun: C
            data.LogSource: WELLDB
            data.Source: WELLDB
            data.ActivityType: HYBRID
            data.LogActivity: C
            data.IsRegular: true
      - name: the curves of the COMPOSITE log of Wellbore A-1
        knownValues:
          locateBy:
            '[data.WellboreID, data.FacilityName]': "Wellbore A-1"
            tags.SourceProject: PROJECT_A
            data.Name: COMPOSITE
          rows:
            # Row 2 of curves_20260924.csv.
            - locateBy:
                data.Curves.CurveID: MD
              check:
                data.Curves.CurveUnit: "{partition}:reference-data--UnitOfMeasure:m:"
                data.Curves.DepthUnit: "{partition}:reference-data--UnitOfMeasure:m:"
                data.Curves.TopDepth: { equals: 2127.504, tolerance: 0.0005 }
                data.Curves.BaseDepth: { equals: 2183.5872, tolerance: 0.0005 }
                data.Curves.CurveDescription: "Measured depth"
                data.Curves.LogCurveBusinessValueID: "{partition}:reference-data--LogCurveBusinessValue:High:"
                data.Curves.LogCurveTypeID: "{partition}:reference-data--LogCurveType:WellDB:MD:"
                data.Curves.LogCurveMainFamilyID: "{partition}:reference-data--LogCurveMainFamily:Reference:"
                data.Curves.LogCurveFamilyID: "{partition}:reference-data--LogCurveFamily:Measured%20Depth:"
            # Row 3 of curves_20260924.csv.
            - locateBy:
                data.Curves.CurveID: BS
              check:
                data.Curves.CurveUnit: "{partition}:reference-data--UnitOfMeasure:in:"
                data.Curves.DepthUnit: "{partition}:reference-data--UnitOfMeasure:m:"
                data.Curves.TopDepth: { equals: 2127.504, tolerance: 0.0005 }
                data.Curves.BaseDepth: { equals: 2183.5872, tolerance: 0.0005 }
                data.Curves.CurveDescription: "Bit Size"
                data.Curves.LogCurveBusinessValueID: "{partition}:reference-data--LogCurveBusinessValue:High:"
                data.Curves.LogCurveTypeID: "{partition}:reference-data--LogCurveType:WellDB:BS:"
                data.Curves.LogCurveMainFamilyID: "{partition}:reference-data--LogCurveMainFamily:BoreholeProperties:"
                data.Curves.LogCurveFamilyID: "{partition}:reference-data--LogCurveFamily:Bit%20Size:"
            # Row 4 of curves_20260924.csv.
            - locateBy:
                data.Curves.CurveID: CALI
              check:
                data.Curves.CurveUnit: "{partition}:reference-data--UnitOfMeasure:in:"
                data.Curves.DepthUnit: "{partition}:reference-data--UnitOfMeasure:m:"
                data.Curves.TopDepth: { equals: 2129.1804, tolerance: 0.0005 }
                data.Curves.BaseDepth: { equals: 2183.5872, tolerance: 0.0005 }
                data.Curves.CurveDescription: "Caliper [hole diameter]"
                data.Curves.LogCurveBusinessValueID: "{partition}:reference-data--LogCurveBusinessValue:High:"
                data.Curves.LogCurveTypeID: "{partition}:reference-data--LogCurveType:WellDB:CALI:"
                data.Curves.LogCurveMainFamilyID: "{partition}:reference-data--LogCurveMainFamily:BoreholeProperties:"
                data.Curves.LogCurveFamilyID: "{partition}:reference-data--LogCurveFamily:Caliper:"
            # Row 5 of curves_20260924.csv.
            - locateBy:
                data.Curves.CurveID: DRHO
              check:
                data.Curves.CurveUnit: "{partition}:reference-data--UnitOfMeasure:g%2Fcm3:"
                data.Curves.DepthUnit: "{partition}:reference-data--UnitOfMeasure:m:"
                data.Curves.TopDepth: { equals: 2127.6564, tolerance: 0.0005 }
                data.Curves.BaseDepth: { equals: 2183.13, tolerance: 0.0005 }
                data.Curves.CurveDescription: "Density correction"
                data.Curves.LogCurveBusinessValueID: "{partition}:reference-data--LogCurveBusinessValue:High:"
                data.Curves.LogCurveTypeID: "{partition}:reference-data--LogCurveType:WellDB:DRHO:"
                data.Curves.LogCurveMainFamilyID: "{partition}:reference-data--LogCurveMainFamily:Density:"
                data.Curves.LogCurveFamilyID: "{partition}:reference-data--LogCurveFamily:Bulk%20Density%20Correction:"
            # Row 6 of curves_20260924.csv.
            - locateBy:
                data.Curves.CurveID: DT
              check:
                data.Curves.CurveUnit: "{partition}:reference-data--UnitOfMeasure:us%2Fft:"
                data.Curves.DepthUnit: "{partition}:reference-data--UnitOfMeasure:m:"
                data.Curves.TopDepth: { equals: 2128.7232, tolerance: 0.0005 }
                data.Curves.BaseDepth: { equals: 2182.2156, tolerance: 0.0005 }
                data.Curves.CurveDescription: "Compressional Slowness"
                data.Curves.LogCurveBusinessValueID: "{partition}:reference-data--LogCurveBusinessValue:High:"
                data.Curves.LogCurveTypeID: "{partition}:reference-data--LogCurveType:WellDB:DT:"
                data.Curves.LogCurveMainFamilyID: "{partition}:reference-data--LogCurveMainFamily:Slowness:"
                data.Curves.LogCurveFamilyID: "{partition}:reference-data--LogCurveFamily:Compressional%20Slowness:"
            # Row 7 of curves_20260924.csv.
            - locateBy:
                data.Curves.CurveID: DTS
              check:
                data.Curves.CurveUnit: "{partition}:reference-data--UnitOfMeasure:us%2Fft:"
                data.Curves.DepthUnit: "{partition}:reference-data--UnitOfMeasure:m:"
                data.Curves.TopDepth: { equals: 2128.1136, tolerance: 0.0005 }
                data.Curves.BaseDepth: { equals: 2183.2824, tolerance: 0.0005 }
                data.Curves.CurveDescription: "Shear Slowness"
                data.Curves.LogCurveBusinessValueID: "{partition}:reference-data--LogCurveBusinessValue:High:"
                data.Curves.LogCurveTypeID: "{partition}:reference-data--LogCurveType:WellDB:DTS:"
                data.Curves.LogCurveMainFamilyID: "{partition}:reference-data--LogCurveMainFamily:Slowness:"
                data.Curves.LogCurveFamilyID: "{partition}:reference-data--LogCurveFamily:Shear%20Slowness:"
            # Row 8 of curves_20260924.csv.
            - locateBy:
                data.Curves.CurveID: GR
              check:
                data.Curves.CurveUnit: "{partition}:reference-data--UnitOfMeasure:gAPI:"
                data.Curves.DepthUnit: "{partition}:reference-data--UnitOfMeasure:m:"
                data.Curves.TopDepth: { equals: 2127.8088, tolerance: 0.0005 }
                data.Curves.BaseDepth: { equals: 2182.368, tolerance: 0.0005 }
                data.Curves.CurveDescription: "Gamma Ray"
                data.Curves.LogCurveTypeID: "{partition}:reference-data--LogCurveType:WellDB:GR:"
                data.Curves.LogCurveMainFamilyID: "{partition}:reference-data--LogCurveMainFamily:GammaRay:"
                data.Curves.LogCurveFamilyID: "{partition}:reference-data--LogCurveFamily:Gamma%20Ray:"
            # Row 9 of curves_20260924.csv.
            - locateBy:
                data.Curves.CurveID: NPHI
              check:
                data.Curves.CurveUnit: "{partition}:reference-data--UnitOfMeasure:m3%2Fm3:"
                data.Curves.DepthUnit: "{partition}:reference-data--UnitOfMeasure:m:"
                data.Curves.TopDepth: { equals: 2128.266, tolerance: 0.0005 }
                data.Curves.BaseDepth: { equals: 2183.4348, tolerance: 0.0005 }
                data.Curves.CurveDescription: "Neutron Porosity"
                data.Curves.LogCurveBusinessValueID: "{partition}:reference-data--LogCurveBusinessValue:High:"
                data.Curves.LogCurveTypeID: "{partition}:reference-data--LogCurveType:WellDB:NPHI:"
                data.Curves.LogCurveMainFamilyID: "{partition}:reference-data--LogCurveMainFamily:Porosity:"
                data.Curves.LogCurveFamilyID: "{partition}:reference-data--LogCurveFamily:Neutron%20Porosity:"
            # Row 10 of curves_20260924.csv.
            - locateBy:
                data.Curves.CurveID: RD
              check:
                data.Curves.CurveUnit: "{partition}:reference-data--UnitOfMeasure:ohm.m:"
                data.Curves.DepthUnit: "{partition}:reference-data--UnitOfMeasure:m:"
                data.Curves.TopDepth: { equals: 2128.1136, tolerance: 0.0005 }
                data.Curves.BaseDepth: { equals: 2182.9776, tolerance: 0.0005 }
                data.Curves.CurveDescription: "Deep resistivity"
                data.Curves.LogCurveBusinessValueID: "{partition}:reference-data--LogCurveBusinessValue:High:"
                data.Curves.LogCurveTypeID: "{partition}:reference-data--LogCurveType:WellDB:RD:"
                data.Curves.LogCurveMainFamilyID: "{partition}:reference-data--LogCurveMainFamily:Resistivity:"
                data.Curves.LogCurveFamilyID: "{partition}:reference-data--LogCurveFamily:Resistivity%20-%20Deep:"
            # Row 11 of curves_20260924.csv.
            - locateBy:
                data.Curves.CurveID: RHOB
              check:
                data.Curves.CurveUnit: "{partition}:reference-data--UnitOfMeasure:g%2Fcm3:"
                data.Curves.DepthUnit: "{partition}:reference-data--UnitOfMeasure:m:"
                data.Curves.TopDepth: { equals: 2128.5708, tolerance: 0.0005 }
                data.Curves.BaseDepth: { equals: 2182.8252, tolerance: 0.0005 }
                data.Curves.CurveDescription: "Bulk Density"
                data.Curves.LogCurveBusinessValueID: "{partition}:reference-data--LogCurveBusinessValue:High:"
                data.Curves.LogCurveTypeID: "{partition}:reference-data--LogCurveType:WellDB:RHOB:"
                data.Curves.LogCurveMainFamilyID: "{partition}:reference-data--LogCurveMainFamily:Density:"
                data.Curves.LogCurveFamilyID: "{partition}:reference-data--LogCurveFamily:Bulk%20Density:"
  - name: composite-samples
    description: "Every curve sample of log LOG-0001/1, from its curve file."
    tags: [welldb, composite, bulk]
    kind: osdu:wks:work-product-component--WellLog:1.4.0
    query: 'tags.WellLogNativeUID:"LOG-0001/1"'
    bulk: { maxRows: 100000 }
    assert:
      - rowCount: 369
      - columns: { equals: [MD, BS, CALI, DRHO, DT, DTS, GR, NPHI, RD, RHOB] }
      - column: MD
        monotonic: strictlyIncreasing
      - { aggregate: count, column: MD, equals: 369 }
      - { aggregate: sum, column: MD, equals: 795396.3264, tolerance: 0.001 }
      - { aggregate: count, column: BS, equals: 369 }
      - { aggregate: sum, column: BS, equals: 3136.5, tolerance: 0.001 }
      - { aggregate: count, column: CALI, equals: 358 }
      - { aggregate: sum, column: CALI, equals: 3337.2611, tolerance: 0.001 }
      - { aggregate: count, column: DRHO, equals: 365 }
      - { aggregate: sum, column: DRHO, equals: 11.6875, tolerance: 0.001 }
      - { aggregate: count, column: DT, equals: 352 }
      - { aggregate: sum, column: DT, equals: 34118.9971, tolerance: 0.001 }
      - { aggregate: count, column: DTS, equals: 363 }
      - { aggregate: sum, column: DTS, equals: 62215.5125, tolerance: 0.001 }
      - { aggregate: count, column: GR, equals: 359 }
      - { aggregate: sum, column: GR, equals: 29401.0621, tolerance: 0.001 }
      - { aggregate: count, column: NPHI, equals: 363 }
      - { aggregate: sum, column: NPHI, equals: 87.9637, tolerance: 0.001 }
      - { aggregate: count, column: RD, equals: 361 }
      - { aggregate: sum, column: RD, equals: 3738.5432, tolerance: 0.001 }
      - { aggregate: count, column: RHOB, equals: 357 }
      - { aggregate: sum, column: RHOB, equals: 836.9555, tolerance: 0.001 }
